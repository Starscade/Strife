services:

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_ANON_ROLE: postgres
      PGRST_DB_SCHEMAS: "${PGRST_DB_SCHEMAS:-public}"
      PGRST_DB_URI: 'postgres://postgres@db'
    image: postgrest/postgrest
    restart: unless-stopped

  db:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      interval: 1s
      retries: 10
      test:
        - 'CMD'
        - 'pg_isready'
        - '-U'
        - 'postgres'
      timeout: 1s
    image: postgres:alpine
    ports:
      - "${PGPORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - './volumes/db/migrations:/docker-entrypoint-initdb.d:ro'
      - "${TMP_DIR:-/var/tmp}:/var/tmp"
      - 'db_data:/var/lib/postgresql/data'

  http:
    environment:
      APEX_DOMAIN: "${APEX_DOMAIN:-localhost}"
      TLS_MODE: "$TLS_MODE"
    image: dunglas/frankenphp
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    restart: unless-stopped
    volumes:
      - './volumes/http/Caddyfile:/etc/frankenphp/Caddyfile:ro'
      - './volumes/http/.pki:/data/frankenphp/pki/authorities/local'
      - "${DOCUMENT_ROOT:-/srv}:/srv/www:ro"
      - "${MEDIA_ROOT:-/srv}:/srv/media:ro"
      - "${TMP_DIR:-/var/tmp}:/var/tmp"

  media:
    command: '--noauth'
    image: filebrowser/filebrowser
    restart: unless-stopped
    volumes:
      - "${MEDIA_ROOT:-/srv}:/srv"
      - "${TMP_DIR:-/var/tmp}:/var/tmp"
      - 'media_db:/database'


volumes:

  db_data:
  media_db:


